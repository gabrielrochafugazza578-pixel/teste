<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Criptas de Valdor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=IM+Fell+English+SC&display=swap">
<style>
:root { --bg: #050403; --gold: #e3b95c; --gold2: #a07a30; --stone: #1a1612; --line: #5a4c38; --text: #ece3d0; --blood: #c01818;
  --display: "IM Fell English SC", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--text);
  font-family: var(--body); font-size: 15px; user-select: none; -webkit-user-select: none; touch-action: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; }
.hidden { display: none !important; }
kbd { display: inline-block; min-width: 1.6em; padding: 1px 5px; border: 1px solid #7a6a50; border-bottom-width: 2px; border-radius: 4px;
  background: #2a241c; color: #f0e2c0; font: 600 11px/1.4 system-ui, sans-serif; text-align: center; margin: 0 1px; }
.serif, h2, .logo, .bigtitle, #floorname, #bossname, .ititle { font-family: var(--display); font-weight: 400; }
h2, .bigtitle, .sub { text-wrap: balance; }

/* ---------- HUD ---------- */
#floorinfo { position: absolute; left: 22px; top: calc(18px + var(--st)); text-shadow: 0 2px 4px #000, 0 0 12px #000; }
#floorname { font-size: 22px; color: var(--gold); letter-spacing: .04em; }
#objective { font-size: 14px; margin-top: 4px; opacity: .92; }
#objective::before { content: "◆ "; color: var(--gold); }
#mapwrap { position: absolute; right: 18px; top: calc(14px + var(--st)); width: 206px; height: 206px; border-radius: 50%;
  background: radial-gradient(circle, transparent 62%, #000 100%); box-shadow: 0 0 0 3px #3a3026, 0 0 0 5px #15110d, 0 6px 20px #000c; }
#minimap { width: 200px; height: 200px; margin: 3px; border-radius: 50%; }
.mapn { display: none; }
#bottom { position: absolute; left: 50%; bottom: calc(14px + var(--sb)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
#hotbar { display: flex; align-items: flex-end; gap: 10px; pointer-events: auto; }
.slot { position: relative; width: 58px; height: 58px; border-radius: 8px; overflow: hidden;
  background: linear-gradient(#2a241e, #15110e); border: 2px solid #5a4c3a; box-shadow: 0 4px 10px #000a, inset 0 0 12px #000; }
.slot.big { width: 62px; height: 62px; }
.slot .ico { position: absolute; inset: 9px; }
.slot .ico svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 2px #000); }
.slot .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.7); border-top: 1px solid #fff3; }
.slot kbd { position: absolute; right: 2px; bottom: 2px; font-size: 10px; padding: 0 4px; }
.slot.empty { opacity: .45; }
.slot.ready:not(.empty) { box-shadow: 0 4px 10px #000a, inset 0 0 12px #000, 0 0 10px #ffd27a33; }
#orb { position: relative; width: 104px; height: 104px; border-radius: 50%; overflow: hidden; margin: 0 6px;
  background: radial-gradient(circle at 50% 60%, #200806, #080302); box-shadow: 0 0 0 4px #3b3127, 0 0 0 7px #16120e, 0 8px 22px #000; }
#orbfill { position: absolute; inset: 0; background: radial-gradient(circle at 40% 35%, #ff6a5a, #c01818 45%, #5a0606); transition: transform .2s; }
#orbshine { position: absolute; left: 18%; top: 8%; width: 45%; height: 30%; border-radius: 50%; background: linear-gradient(#fff6, #fff0); }
#hptext { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000, 0 0 6px #000; }
#rollpip { position: absolute; left: 50%; bottom: 7px; width: 22px; height: 5px; margin-left: -11px; border-radius: 3px; background: #9ad; box-shadow: 0 0 6px #9adf; }
#orb.low { animation: pulse 0.8s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px #7a1a12, 0 0 0 7px #16120e, 0 0 30px #f00a; } }
#xpbar { position: relative; width: 380px; height: 7px; margin-bottom: 9px; border-radius: 4px; background: #0008; box-shadow: 0 0 0 1px #4a3f30; }
#xpfill { height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, #7fd05a, #d8f07a); transition: width .3s; }
#lvl { position: absolute; left: 50%; top: -19px; transform: translateX(-50%); font-size: 12px; color: #d8f07a; text-shadow: 0 1px 3px #000; }
#res { position: absolute; left: calc(100% + 14px); bottom: 6px; display: flex; flex-direction: column; gap: 6px; white-space: nowrap; }
#res .r { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000; }
#res svg { width: 24px; height: 24px; }
#res .empty { color: #ff6a5a; }
#bossbar { position: absolute; left: 50%; top: calc(20px + var(--st)); transform: translateX(-50%); width: min(560px, 70vw); text-align: center; }
#bossname { color: #ffcf9a; font-size: 24px; letter-spacing: .05em; text-shadow: 0 2px 6px #000, 0 0 16px #a30; margin-bottom: 6px; }
#bossbar .bar { position: relative; height: 14px; border-radius: 3px; background: #120806; box-shadow: 0 0 0 2px #4a3a2a, 0 0 0 4px #110c08, 0 4px 14px #000; overflow: hidden; }
#bossfill, #bossghost { position: absolute; left: 0; top: 0; bottom: 0; }
#bossghost { background: #f0d0a0; opacity: .5; }
#bossfill { background: linear-gradient(#ff5a3a, #9a1808); z-index: 1; }
#toasts { position: absolute; left: 0; right: 0; top: 24%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.toast { padding: 6px 18px; background: linear-gradient(90deg, #0000, #000a, #0000); font-size: 17px; text-shadow: 0 1px 3px #000; animation: tin .3s; transition: opacity .5s; }
.toast.big { font: 400 34px var(--display); letter-spacing: .06em; padding: 8px 60px; }
.toast.out { opacity: 0; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }
.bigtitle { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: 52px; color: #f4e2b8; letter-spacing: .06em;
  text-shadow: 0 3px 10px #000, 0 0 30px #a86a1a88; animation: title 4.2s forwards; }
.bigtitle small { display: block; font: 700 14px var(--body); text-transform: uppercase; color: var(--gold); letter-spacing: .4em; margin-bottom: 6px; }
@keyframes title { 0% { opacity: 0; transform: scale(1.06); } 15%, 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
#prompt { position: absolute; left: 50%; bottom: calc(150px + var(--sb)); transform: translateX(-50%); text-shadow: 0 1px 3px #000; }
#prompt.simple { padding: 8px 16px; background: #000a; border-radius: 6px; font-size: 16px; border: 1px solid #5a4c3a; }
#prompt.item { width: 300px; padding: 12px 16px; background: linear-gradient(#1c1712f0, #0e0b09f0); border: 2px solid; border-radius: 8px; box-shadow: 0 8px 30px #000; font-size: 14px; }
.ititle { font-size: 21px; }
.icat { font-size: 12px; opacity: .7; margin-bottom: 6px; }
#prompt table { width: 100%; border-collapse: collapse; margin: 4px 0; }
#prompt td { padding: 1px 0; } #prompt td:last-child { text-align: right; font-weight: 700; }
#prompt ul { margin: 6px 0; padding-left: 18px; color: #b9a7ff; }
#prompt .desc { font-style: italic; opacity: .85; margin: 4px 0; }
#prompt .vs { margin-top: 6px; font-size: 12px; opacity: .85; }
#prompt .hint { margin-top: 6px; font-size: 12px; color: #d8c890; }
#prompt .act { margin-top: 8px; text-align: center; font-weight: 700; color: var(--gold); }
i.up { color: #6dff7a; font-style: normal; } i.dn { color: #ff6a5a; font-style: normal; }
#floats, #bars { position: absolute; inset: 0; overflow: hidden; }
.ebar { position: absolute; left: 0; top: 0; width: 44px; height: 5px; background: #000b; border: 1px solid #000; border-radius: 2px; will-change: transform; }
.ebar i { display: block; height: 100%; background: linear-gradient(#ff6a4a, #b01c10); border-radius: 1px; }
.ebar.elite { width: 64px; height: 7px; border-color: #e3b95c; }
.ebar.elite i { background: linear-gradient(#ffcf5a, #c07010); }
.float { position: absolute; left: 0; top: 0; font: 800 19px var(--body); font-variant-numeric: tabular-nums; text-shadow: 0 0 3px #000, 0 2px 2px #000; white-space: nowrap; will-change: transform; }
.float.big { font-size: 24px; }
#hurt { position: absolute; inset: 0; opacity: 0; box-shadow: inset 0 0 120px 20px #a00000; }
#hurt.on { animation: hurt .5s; }
@keyframes hurt { 0% { opacity: .45; } 100% { opacity: 0; } }

/* ---------- menus ---------- */
#panel { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; pointer-events: auto;
  background: radial-gradient(circle, #0008, #000d); }
#panel.title { background: radial-gradient(circle at 50% 45%, #0000 20%, #000a 75%); }
.card { min-width: 340px; max-width: min(620px, 92vw); max-height: 92vh; overflow: auto; padding: 30px 34px; text-align: center;
  background: linear-gradient(#18130fe8, #0b0908f0); border: 1px solid #6a5838; border-radius: 10px;
  box-shadow: 0 0 0 4px #0008, 0 20px 60px #000, inset 0 0 40px #0008; }
#panel.title .card { background: linear-gradient(#120e0bcc, #0a0807dd); }
.logo { display: flex; flex-direction: column; align-items: center; line-height: .95; margin: 4px 0 16px; }
.logo span { font-size: 64px; font-weight: 400; letter-spacing: .05em; background: linear-gradient(#fff4d0, #e3b95c 55%, #8a5a18); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 2px #000) drop-shadow(0 0 18px #c8801a66); }
.logo small { font: 700 13px var(--body); text-transform: uppercase; color: var(--gold); letter-spacing: .5em; margin: 6px 0; }
h2 { margin: 0 0 14px; font-size: 36px; color: #f2dfb2; letter-spacing: .04em; text-shadow: 0 2px 8px #000; }
h2.red { color: #ff7a5a; }
.sub { font-size: 16px; line-height: 1.55; opacity: .9; margin: 0 auto 18px; max-width: 34em; }
button { display: block; width: 100%; margin: 9px 0; padding: 11px 16px; border-radius: 6px; cursor: pointer;
  font: 400 19px var(--display); letter-spacing: .04em; color: #f0e2c0;
  background: linear-gradient(#3a3024, #211a13); border: 1px solid #7a6444; box-shadow: inset 0 1px 0 #fff2, 0 3px 8px #0008; transition: .15s; }
button:hover { border-color: var(--gold); color: #fff; box-shadow: inset 0 1px 0 #fff3, 0 0 14px #e3b95c55; }
button.primary { background: linear-gradient(#7a5a24, #4a3410); border-color: var(--gold); font-size: 22px; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.best { margin-top: 14px; color: var(--gold); }
.tiny { font-size: 12px; opacity: .6; margin-top: 14px; line-height: 1.5; }
.keys { width: 100%; text-align: left; border-collapse: collapse; font-size: 14px; }
.keys td { padding: 5px 4px; border-bottom: 1px solid #ffffff12; } .keys td:first-child { white-space: nowrap; padding-right: 14px; }
.stats { display: flex; justify-content: center; gap: 12px; margin: 10px 0 18px; }
.stats div { min-width: 80px; padding: 8px 10px; background: #0006; border: 1px solid #4a3c2a; border-radius: 6px; font-size: 12px; opacity: .9; }
.stats b { display: block; font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }
.gearlist { margin-top: 14px; text-align: left; font-size: 13px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.gearlist div { display: flex; align-items: center; gap: 6px; } .gearlist svg, .gearlist .ph { width: 20px; height: 20px; flex: none; }
.gearlist .lv { grid-column: 1 / -1; justify-content: center; margin-top: 6px; color: var(--gold); }

/* ---------- tela de abertura ---------- */
#panel.title2 { background: none; display: block; }
.tscreen { position: absolute; inset: 0; animation: tin2 2.2s ease-out both; }
@keyframes tin2 { from { background: #000; } to { background: #0000; } }
.tscreen::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, #050302f2 0%, #050302d0 30%, #05030266 50%, #0000 68%), linear-gradient(0deg, #000c 0%, #0000 30%), radial-gradient(ellipse at 75% 55%, #0000 30%, #0008 100%); }
.tleft { position: absolute; left: max(6vw, 20px); top: 50%; transform: translateY(-50%); width: min(430px, 88vw); display: flex; flex-direction: column; gap: 14px; }
.teyebrow { font: 700 12px var(--body); letter-spacing: .42em; text-transform: uppercase; color: #c9a14e; opacity: 0; animation: up .9s .5s ease-out forwards; }
.tlogo { margin: 0; display: flex; flex-direction: column; line-height: .9; font-family: var(--display); font-weight: 400; }
.tlogo span { background: linear-gradient(100deg, #8a5a18 0%, #e3b95c 30%, #fff6d8 45%, #e3b95c 60%, #8a5a18 100%); background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 3px #000) drop-shadow(0 0 22px #c8801a55);
  animation: shimmer 7s linear infinite, up 1.2s ease-out both; }
.tlogo .t1 { font-size: clamp(56px, 9vw, 104px); letter-spacing: .02em; animation-delay: 0s, .7s; }
.tlogo .t2 { font-size: clamp(30px, 4.6vw, 52px); letter-spacing: .12em; margin-left: .15em; animation-delay: -2s, 1s; }
@keyframes shimmer { from { background-position: 150% 0; } to { background-position: -100% 0; } }
@keyframes up { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } to { opacity: 1; transform: none; } }
.torn { width: 260px; height: 14px; opacity: 0; animation: up 1s 1.3s ease-out forwards; }
.tsub { margin: 0; font-size: 16px; line-height: 1.55; color: #e8dcc0; opacity: 0; animation: up 1s 1.5s ease-out forwards; max-width: 32em; text-shadow: 0 2px 6px #000; }
.tmenu { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; opacity: 0; animation: up 1s 1.8s ease-out forwards; }
.tmenu button { position: relative; margin: 0; width: auto; text-align: left; background: none; border: none; box-shadow: none; padding: 9px 0 9px 26px;
  font: 400 24px var(--display); color: #d8ccb0; letter-spacing: .04em; transition: color .2s, padding .2s; }
.tmenu button small { display: block; font: 600 12px var(--body); letter-spacing: .06em; color: #a89878; margin-top: 2px; }
.tmenu button::before { content: ""; position: absolute; left: 4px; top: 50%; width: 10px; height: 10px; margin-top: -5px; transform: rotate(45deg) scale(0); background: #e3b95c; box-shadow: 0 0 12px #ffb040; transition: transform .2s; }
.tmenu button small ~ ::before { top: 30%; }
.tmenu button:hover, .tmenu button:focus-visible { color: #fff4d8; padding-left: 34px; outline: none; box-shadow: none; text-shadow: 0 0 18px #ffb04088; }
.tmenu button:hover::before, .tmenu button:focus-visible::before { transform: rotate(45deg) scale(1); }
.tmenu button.tmain { font-size: 30px; color: #f4e2b8; }
.tmenu button.warn { color: #ff9a7a; font-size: 19px; }
.thint { margin: 6px 0 0; font-size: 12px; color: #8a7a60; opacity: 0; animation: up 1s 2.2s ease-out forwards; }
.tfoot { position: absolute; right: 22px; bottom: calc(16px + var(--sb)); font-size: 12px; color: #9a8a70; opacity: .7; }
.embers { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.embers i { position: absolute; bottom: -10px; width: 4px; height: 4px; border-radius: 50%; background: #ffb050; box-shadow: 0 0 8px 2px #ff7a20aa;
  transform: scale(var(--s)); animation: ember linear infinite; opacity: 0; }
@keyframes ember { 0% { transform: translate(0, 0) scale(var(--s)); opacity: 0; } 10% { opacity: .9; } 80% { opacity: .6; } 100% { transform: translate(var(--dx), -95vh) scale(calc(var(--s) * .3)); opacity: 0; } }
@media (max-width: 760px) {
  .tscreen::before { background: linear-gradient(0deg, #050302f5 0%, #050302c0 55%, #0000 85%); }
  .tleft { top: auto; bottom: calc(40px + var(--sb)); transform: none; gap: 10px; }
  .tsub { font-size: 14px; } .tmenu button { font-size: 20px; padding: 6px 0 6px 24px; } .tmenu button.tmain { font-size: 24px; } .thint { display: none; }
  .tfoot { display: none; }
}

/* ---------- cutscenes ---------- */
#cine { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
#cine .cbar { position: absolute; left: 0; right: 0; height: 12vh; background: #000; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
#cine .cbar.t { top: 0; transform: translateY(-100%); } #cine .cbar.b { bottom: 0; transform: translateY(100%); }
#cine.on .cbar { transform: none; } #cine.short .cbar { height: 8vh; }
#cine .cfade { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity 1.2s; }
#cine .cflash { position: absolute; inset: 0; background: radial-gradient(circle, #fff, #fff0 80%); opacity: 0; }
#cine .cflash.go { animation: flash .9s ease-out; } @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
#cine .cname { position: absolute; left: 7vw; bottom: 17vh; opacity: 0; transform: translateX(-20px); transition: opacity .6s, transform .8s; text-shadow: 0 3px 10px #000, 0 0 30px #000; }
#cine .cname.show { opacity: 1; transform: none; }
#cine .cname b { display: block; font: 400 clamp(38px, 6vw, 72px) var(--display); color: #f4e2b8; letter-spacing: .04em; line-height: 1; }
#cine .cname em { display: block; font: 700 14px var(--body); font-style: normal; letter-spacing: .35em; text-transform: uppercase; color: var(--gold); margin-top: 10px; padding-top: 10px; border-top: 1px solid #c9a14e88; width: max-content; }
#cine .csub { position: absolute; left: 50%; bottom: calc(12vh + 22px); transform: translateX(-50%); width: min(760px, 88vw); text-align: center; opacity: 0; transition: opacity .5s; }
#cine .csub.show { opacity: 1; }
#cine .csub .csp { display: block; font: 700 12px var(--body); letter-spacing: .3em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
#cine .csub .csp:empty { display: none; }
#cine .csub p { margin: 0; font: 400 22px/1.45 var(--display); color: #f0e6d0; text-shadow: 0 2px 8px #000; min-height: 1.45em; }
#cine .cskip { position: absolute; right: 20px; top: calc(12vh + 14px); pointer-events: auto; cursor: pointer; font: 700 13px var(--body); letter-spacing: .12em; color: #c9b890; padding: 6px 12px; border: 1px solid #6a5838; border-radius: 16px; background: #0008; }
#cine .cskip:hover { color: #fff; border-color: var(--gold); }
#cine.short .csub p { font-size: 18px; }
.cinehide { opacity: 0 !important; transition: opacity .4s; pointer-events: none !important; }
#hud, #toasts { transition: opacity .6s; }
@media (max-width: 760px) { #cine .csub p { font-size: 16px; } #cine .cname b { font-size: 34px; } #cine .cname em { font-size: 11px; } }

/* ---------- missoes no HUD ---------- */
#qtrack { margin-top: 6px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
#qtrack div { color: #e8dcc0; opacity: .9; } #qtrack div::before { content: "▸ "; color: #c9a0ff; } #qtrack b { color: var(--gold); font-variant-numeric: tabular-nums; }
#hudbtns { display: flex; gap: 8px; margin-top: 10px; pointer-events: auto; }
.hb { width: 38px; height: 38px; padding: 5px; border-radius: 8px; cursor: pointer; background: linear-gradient(#2a241e, #15110e); border: 1px solid #6a5838; box-shadow: 0 3px 8px #000a; }
.hb svg { width: 100%; height: 100%; } .hb:hover, .hb.down { border-color: var(--gold); }

/* ---------- estacoes ---------- */
#panel.station .card { width: min(760px, 94vw); max-width: none; text-align: left; padding: 22px 26px; }
#panel.station h2 { text-align: center; margin-bottom: 6px; }
#panel.station h3 { font: 400 20px var(--display); color: var(--gold); margin: 16px 0 8px; letter-spacing: .03em; }
#panel.station .sub { text-align: center; }
.res2 { display: flex; justify-content: center; align-items: center; gap: 6px; font-weight: 800; font-size: 16px; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.res2 svg { width: 20px; height: 20px; } .res2 b { margin-right: 12px; }
.tabs { display: flex; gap: 8px; margin-bottom: 8px; } .tabs button { margin: 0; padding: 8px; font-size: 17px; } .tabs button.on { border-color: var(--gold); background: linear-gradient(#5a4420, #3a2a10); }
.list { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; background: #0007; border: 1px solid #3a3024; border-radius: 6px; }
.row .ri { width: 34px; height: 34px; flex: none; } .row .ri svg { width: 100%; height: 100%; }
.row .rl { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row .rl b { font-size: 15px; } .row .rl small { font-size: 12px; opacity: .8; line-height: 1.35; } .row .rl small.aff { color: #b9a7ff; opacity: 1; } .row .rl small.rw { color: #ffe08a; opacity: 1; }
.row .rr { display: flex; align-items: center; gap: 8px; }
.row button { width: auto; flex: none; margin: 0; padding: 7px 12px; font-size: 15px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.row button svg { width: 16px; height: 16px; }
.prog { font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
button.small { font-size: 13px !important; padding: 5px 8px !important; }
button:disabled { opacity: .4; cursor: default; box-shadow: none; }
